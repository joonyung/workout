name: WorkoutWatch
options:
  bundleIdPrefix: com.joonyung.workout
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  WorkoutWatchCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WorkoutWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: WorkoutWatchCore
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Workout
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.joonyung.workout.companion
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joonyung.workout.companion.watchkitapp
        PRODUCT_NAME: WorkoutWatch
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  WorkoutCompanion:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
    dependencies:
      - package: WorkoutWatchCore
      - target: WorkoutWatch
        embed: true
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Workout
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joonyung.workout.companion
        PRODUCT_NAME: WorkoutCompanion
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WorkoutCompanion:
    build:
      targets:
        WorkoutCompanion: all
        WorkoutWatch: all
    run:
      config: Debug
    archive:
      config: Release

  WorkoutWatch:
    build:
      targets:
        WorkoutWatch: all
    run:
      config: Debug
